name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bot-round:
    name: Play a bot-only round
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GODOT_VERSION: 4.4.1
    steps:
      - uses: actions/checkout@v4

      - name: Download Godot
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot

      - name: Import project
        run: ./godot --headless --path . --import

      - name: Play one round with bots only
        run: |
          ./godot --headless --path . -- --autotest 2>&1 | tee round.log
          grep -q "AUTOTEST PASS" round.log
          if grep -qE "SCRIPT ERROR|Parse Error" round.log; then exit 1; fi
